<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos</title>
    <!-- Carregue o Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" href="../css/medico.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="#" class="navbar-logo">MedCare Clínica Médica</a>
            <ul class="navbar-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-10 col-md-offset-1">
                <div class="panel panel-default panel-table">
                    <div class="panel-heading">
                        <div class="row">
                            <div class="col col-xs-6">
                                <h2 class="panel-title">Médicos Cadastrados</h2>
                            </div>
                            <div class="col col-xs-6 text-right">
                                <!-- Botão para abrir o modal de cadastro -->
                                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#modalCadastroMedico">
                                    <span class="glyphicon glyphicon-plus" aria-hidden="true"></span> Cadastrar Médico
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="tabela-medicos" class="tabela-container">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>ID</th> <!-- Nova coluna para o ID -->
                                        <th>Nome</th>
                                        <th>CRM</th>
                                        <th>Especialidade</th>
                                    </tr>
                                </thead>
                                <tbody id="corpo-tabela-medicos">
                                    <!-- Os dados dos médicos serão inseridos aqui dinamicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="panel-footer">
                        <div class="row">
                            <div class="col col-xs-offset-3 col-xs-6">
                                <nav aria-label="Page navigation" class="text-center">
                                    <ul class="pagination">
                                        <li><a href="#" aria-label="Previous"><span aria-hidden="true">«</span></a></li>
                                        <li class="active"><a href="#">1</a></li>
                                        <li><a href="#">2</a></li>
                                        <li><a href="#">3</a></li>
                                        <li><a href="#">4</a></li>
                                        <li><a href="#">5</a></li>
                                        <li><a href="#" aria-label="Next"><span aria-hidden="true">»</span></a></li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Cadastro de Médico -->
    <div class="modal fade" id="modalCadastroMedico" tabindex="-1" role="dialog" aria-labelledby="modalCadastroMedicoLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCadastroMedicoLabel">Cadastrar Médico</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Formulário de cadastro -->
                    <form id="formCadastroMedico">
                        <div class="form-group">
                            <label for="nome">Nome:</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="form-group">
                            <label for="crm">CRM:</label>
                            <input type="text" class="form-control" id="crm" name="crm" required>
                        </div>
                        <div class="form-group">
                            <label for="especialidade">Especialidade:</label>
                            <input type="text" class="form-control" id="especialidade" name="especialidade" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarMedico">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Carregue o jQuery antes do Bootstrap -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <!-- Seu JavaScript personalizado -->
    <script src="../js/scripts.js"></script>
</body>
</html>
