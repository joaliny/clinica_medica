    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9f2f9; /* Fundo azul claro */
            padding: 20px;
        }
        .sidebar {
            background-color: #2c3e50; /* Azul escuro */
            color: white;
            padding: 20px;
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        .sidebar h2 {
            margin-top: 0;
            color: #3498db; /* Azul claro */
            text-align: center;
        }
        .sidebar ul {
            list-style-type: none;
            padding: 0;
        }
        .sidebar ul li {
            margin: 15px 0;
        }
        .sidebar ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            display: block;
            padding: 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .sidebar ul li a:hover {
            background-color: #3498db; /* Azul claro ao passar o mouse */
            color: white;
        }
        .content {
            margin-left: 270px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .content h1 {
            margin-bottom: 20px;
            color: #2c3e50; /* Azul escuro */
        }
        .btn-primary {
            background-color: #3498db; /* Azul claro */
            border-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9; /* Azul mais escuro ao passar o mouse */
            border-color: #2980b9;
        }
        .form-control {
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .form-control:focus {
            border-color: #3498db; /* Azul claro ao focar */
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .grafico-container {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
